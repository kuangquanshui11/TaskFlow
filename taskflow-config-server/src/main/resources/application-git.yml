spring:
  cloud:
    config:
      server:
        git:
          uri: "${TASKFLOW_CONFIG_GIT_URI}"
          default-label: "${TASKFLOW_CONFIG_GIT_LABEL:main}"
          username: "${TASKFLOW_CONFIG_GIT_USERNAME:}"
          password: "${TASKFLOW_CONFIG_GIT_PASSWORD:}"
          clone-on-start: true
