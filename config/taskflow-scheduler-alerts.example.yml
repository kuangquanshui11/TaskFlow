# Merge into each Scheduler local config. All replicas that read the same database use the same Worker inventory.
taskflow:
  metrics:
    expected-workers: "${TASKFLOW_METRICS_EXPECTED_WORKERS:worker-default}"
management:
  opentelemetry:
    resource-attributes:
      "[service.name]": taskflow-scheduler
      "[service.instance.id]": "${TASKFLOW_SCHEDULER_METRICS_INSTANCE_ID:scheduler-1}"
  otlp:
    metrics:
      export:
        enabled: true
        step: 15s
        url: "${TASKFLOW_SCHEDULER_ALERTS_OTLP_URL:http://127.0.0.1:9090/api/v1/otlp/v1/metrics}"
