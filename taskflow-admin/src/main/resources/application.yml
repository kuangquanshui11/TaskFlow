spring:
  application:
    name: taskflow-admin
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      micrometer:
        enabled: true
    loadbalancer:
      retry:
        enabled: false
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
  config:
    import:
      - optional:file:./config/taskflow-admin-local.yml
      - optional:file:./config/taskflow-internal-local.yml
      - classpath:governance.yml
      - optional:file:./config/taskflow-platform-local.yml
      - optional:file:./config/taskflow-access-local.yml
  datasource:
    url: "${TASKFLOW_ADMIN_DB_URL:jdbc:mysql://localhost:3306/taskflow_admin?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=5000&socketTimeout=10000}"
    username: "${TASKFLOW_ADMIN_DB_USERNAME:root}"
    password: "${TASKFLOW_ADMIN_DB_PASSWORD:}"
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    baseline-on-migrate: "${TASKFLOW_ADMIN_DB_BASELINE_ON_MIGRATE:false}"
    baseline-version: 1
  data:
    redis:
      # 本机地址和凭据从被 Git 忽略的配置读取，环境变量可覆盖。
      host: "${TASKFLOW_ADMIN_REDIS_HOST:localhost}"
      port: "${TASKFLOW_ADMIN_REDIS_PORT:6379}"
      # 当前服务器已验证使用仅密码认证，用户名留空。
      username: "${TASKFLOW_ADMIN_REDIS_USERNAME:}"
      password: "${TASKFLOW_ADMIN_REDIS_PASSWORD:}"
      database: "${TASKFLOW_ADMIN_REDIS_DATABASE:0}"
      connect-timeout: 2s
      timeout: 1s
      repositories:
        enabled: false

server:
  address: "${TASKFLOW_ADMIN_BIND_ADDRESS:127.0.0.1}"
  port: "${TASKFLOW_ADMIN_PORT:8080}"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 查询始终遵守数据库事务视图，不引入 MyBatis 会话或二级查询缓存。
    local-cache-scope: STATEMENT
    cache-enabled: false

management:
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: "${TASKFLOW_TRACING_EXPORT_ENABLED:false}"
    sampling:
      probability: "${TASKFLOW_TRACING_SAMPLING:0.1}"
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "${TASKFLOW_OTLP_ENDPOINT:http://localhost:4318/v1/traces}"
          timeout: 3s
          connect-timeout: 2s
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # 与业务缓存开关独立；启用后 Redis 故障会使健康端点返回 DOWN。
      enabled: "${TASKFLOW_ADMIN_REDIS_ENABLED:false}"

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

eureka:
  client:
    enabled: false
taskflow:
  reconciliation:
    max-batch-size: 100
    scan-interval: 10s
    repair-interval: 1s
    max-check-age: 5m
  access:
    issuer: "${TASKFLOW_JWT_ISSUER:}"
    audience: "${TASKFLOW_JWT_AUDIENCE:taskflow-api}"
    client-id: "${TASKFLOW_OIDC_CLIENT_ID:taskflow-console}"
    public-key-location: "${TASKFLOW_JWT_PUBLIC_KEY_LOCATION:}"
    session:
      idle-timeout: 30m
      login-window: 2m
      rotation-grace: 10s
      key-prefix: "${TASKFLOW_ADMIN_SESSION_KEY_PREFIX:taskflow:admin:access:session:v1:}"
  nodes:
    scheduler-url: "${taskflow.execution.scheduler-url}"
    control-token: "${taskflow.execution.control-token}"
    connect-timeout: 2s
    request-timeout: 3s
  job-sync:
    enabled: "${TASKFLOW_JOB_SYNC_ENABLED:true}"
    scheduler-url: "${TASKFLOW_SCHEDULER_URL:http://localhost:8081}"
    control-token: "${TASKFLOW_CONTROL_TOKEN:}"
    connect-timeout: 2s
    request-timeout: 3s
    scan-interval: 1s
    batch-size: 20
    max-attempts: 5
    retry-delay: 2s
    max-retry-delay: 60s
    claim-lease: 30s
  execution:
    scheduler-url: "${TASKFLOW_SCHEDULER_URL:http://localhost:8081}"
    control-token: "${TASKFLOW_CONTROL_TOKEN:}"
    connect-timeout: 2s
    request-timeout: 3s
  persistence:
    database-type: MYSQL
    max-page-size: 100
  jobs:
    # 配置允许项；实际在线节点及 Handler 能力从 Scheduler 的节点接口查询。
    allowed-handler-keys: "${TASKFLOW_ADMIN_ALLOWED_HANDLER_KEYS:demoSuccess,demoFail,demoSlow,demoFailOnce}"
    detail-cache:
      enabled: "${TASKFLOW_ADMIN_JOB_CACHE_ENABLED:true}"
      ttl: "${TASKFLOW_ADMIN_JOB_CACHE_TTL:60s}"
      key-prefix: "${TASKFLOW_ADMIN_JOB_CACHE_KEY_PREFIX:taskflow:admin:job:detail:v1:}"
      # 包含首次删除；仅提交后删除重试，读/回填不重试。
      eviction-attempts: "${TASKFLOW_ADMIN_JOB_CACHE_EVICTION_ATTEMPTS:3}"
