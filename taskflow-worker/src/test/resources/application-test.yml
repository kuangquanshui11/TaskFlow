spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
  rabbitmq:
    dynamic: false
  datasource:
    url: "jdbc:h2:mem:taskflow-worker-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
  flyway:
    enabled: true
taskflow:
  nodes:
    enabled: false
    node-token: test-node-token
  dispatch:
    transport: http
    consumer-enabled: false
  execution:
    result-persistence:
      max-attempts: 3
      retry-delay: 10ms
    scanning-enabled: false
    parallelism: 2
    max-pending: 4
    max-report-attempts: 3
    control-token: test-control-token
    dispatch-token: test-dispatch-token
    report-token: test-report-token
management:
  health:
    rabbit:
      enabled: false
