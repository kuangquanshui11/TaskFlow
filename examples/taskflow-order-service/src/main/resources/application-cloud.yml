spring:
  config:
    import: optional:file:./config/taskflow-platform-local.yml
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: "${TASKFLOW_REGISTRY_URL:${taskflow.registry.url}}"
  instance:
    instance-id: "${spring.application.name}:${TASKFLOW_INSTANCE_ID:${random.uuid}}"
    hostname: "${TASKFLOW_INSTANCE_HOST:localhost}"
