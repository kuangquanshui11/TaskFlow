spring:
  application:
    name: taskflow-order-service
  config:
    import:
      - optional:file:./config/taskflow-order-local.yml
      - optional:file:./config/taskflow-inventory-sync-local.yml
      - optional:file:./config/taskflow-order-cleanup-local.yml
  datasource:
    url: "${TASKFLOW_ORDER_DB_URL:jdbc:mysql://localhost:3306/taskflow_order?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=5000}"
    username: "${TASKFLOW_ORDER_DB_USERNAME:taskflow_order}"
    password: "${TASKFLOW_ORDER_DB_PASSWORD:}"
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
      maximum-pool-size: 16
      connection-timeout: 3000
  data:
    redis:
      host: "${TASKFLOW_ORDER_REDIS_HOST:localhost}"
      port: "${TASKFLOW_ORDER_REDIS_PORT:6379}"
      password: "${TASKFLOW_ORDER_REDIS_PASSWORD:}"
      connect-timeout: 500ms
      timeout: 500ms
server:
  address: "${TASKFLOW_ORDER_BIND_ADDRESS:127.0.0.1}"
  port: "${TASKFLOW_ORDER_PORT:8083}"
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false
order:
  inventory-sync:
    enabled: "${TASKFLOW_INVENTORY_SYNC_SOURCE_ENABLED:false}"
    sample-source: "${TASKFLOW_INVENTORY_SYNC_SAMPLE_SOURCE:classpath:samples/inventory-snapshot.json}"
  cleanup:
    enabled: "${TASKFLOW_EXPIRED_DATA_CLEANUP_SOURCE_ENABLED:false}"
    token: "${TASKFLOW_EXPIRED_DATA_CLEANUP_TOKEN:}"
  samples-enabled: "${TASKFLOW_ORDER_SAMPLES_ENABLED:false}"
  api-token: "${TASKFLOW_ORDER_API_TOKEN:}"
  worker-token: "${TASKFLOW_ORDER_WORKER_TOKEN:}"
  wechat-pay:
    enabled: "${TASKFLOW_WECHAT_PAY_ENABLED:false}"
    app-id: "${TASKFLOW_WECHAT_PAY_APP_ID:}"
    merchant-id: "${TASKFLOW_WECHAT_PAY_MERCHANT_ID:}"
    merchant-serial: "${TASKFLOW_WECHAT_PAY_MERCHANT_SERIAL:}"
    private-key-path: "${TASKFLOW_WECHAT_PAY_PRIVATE_KEY_PATH:}"
    public-key-id: "${TASKFLOW_WECHAT_PAY_PUBLIC_KEY_ID:}"
    public-key-path: "${TASKFLOW_WECHAT_PAY_PUBLIC_KEY_PATH:}"
    api-v3-key: "${TASKFLOW_WECHAT_PAY_API_V3_KEY:}"
    notify-url: "${TASKFLOW_WECHAT_PAY_NOTIFY_URL:}"
    connect-timeout: 2s
    request-timeout: 5s
  payment-work:
    inventory-release-enabled: "${TASKFLOW_INVENTORY_RELEASE_ENABLED:false}"
    inventory-release-url: "${TASKFLOW_INVENTORY_RELEASE_URL:}"
    inventory-release-token: "${TASKFLOW_INVENTORY_RELEASE_TOKEN:}"
    inventory-connect-timeout: 2s
    inventory-request-timeout: 5s
    lease: 30s
    retry-delay: 15s
    payment-poll-delay: 30s
    refund-poll-delay: 1m
    reconciliation-window: 8d
    max-failures: 8
    batch-size: 10
    scan-enabled: true
    scan-delay: 2000
  payment-window: "${TASKFLOW_ORDER_PAYMENT_WINDOW:30m}"
  cache-enabled: "${TASKFLOW_ORDER_CACHE_ENABLED:true}"
  cache-ttl: 30s
  outbox-delay: 1000
  outbox-retry-delay: 5s
  outbox-max-attempts: 10
